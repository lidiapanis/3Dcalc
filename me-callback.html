<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Autorizando Melhor Envio...</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0; background: #f4f7f6;
    }
    .box {
      background: #fff; padding: 40px; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 420px; width: 90%;
    }
    .icon { font-size: 3em; margin-bottom: 16px; }
    h2 { margin: 0 0 8px; color: #333; }
    p  { color: #666; font-size: 0.9em; line-height: 1.5; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e0e0e0; border-top-color: #4A93B0;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo { width: 48px; height: 48px; margin-bottom: 12px; }
  </style>
</head>
<body>
<div class="box" id="box">
  <img src="kombinei-logo.svg" alt="KOMBINEI" class="logo">
  <div class="spinner"></div>
  <h2>Autorizando Melhor Envio...</h2>
  <p>Trocando código de autorização pelo token de acesso.</p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code   = params.get("code");
  const error  = params.get("error");

  function showResult(ok, msg) {
    document.getElementById("box").innerHTML = `
      <img src="kombinei-logo.svg" alt="KOMBINEI" class="logo">
      <div class="icon">${ok ? "✅" : "❌"}</div>
      <h2>${ok ? "Melhor Envio autorizado!" : "Erro na autorização"}</h2>
      <p>${msg}</p>
      ${ok ? "<p><small>Pode fechar esta aba e voltar ao sistema.</small></p>" : ""}`;
  }

  async function exchange(code) {
    const resp = await fetch("/api/frete/auth", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ code }),
    });
    const json = await resp.json();
    if (!json.success) throw new Error(json.error);
    return json.data;
  }

  if (error) {
    showResult(false, "O Melhor Envio retornou: " + error);
  } else if (!code) {
    showResult(false, "Nenhum código de autorização encontrado na URL.");
  } else {
    exchange(code)
      .then(d => showResult(true, d.message || "Token salvo com sucesso."))
      .catch(e => showResult(false, e.message));
  }
</script>
</body>
</html>
