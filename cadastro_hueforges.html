<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de HueForge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="empresa.js"></script>
    <script src="hueforge.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 24px 12px; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); max-width: 560px; width: 100%; }
        h1 { color: #333; text-align: center; margin-bottom: 25px; }
        fieldset { border: 1px solid #ccc; border-radius: 5px; padding: 15px; margin-bottom: 20px; }
        legend { font-weight: bold; color: #4A93B0; padding: 0 10px; }
        label { display: block; margin-top: 10px; font-weight: 500; color: #555; }
        input[type="text"] {
            width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px;
            border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-family: inherit; background:#fff;
        }
        .hint { font-size: 0.82em; color: #999; margin: 4px 0 0; }
        .linha-link { display: flex; gap: 8px; align-items: flex-start; }
        .linha-link input { flex: 1; }
        .btn-inline { width:auto; background:#4A93B0; color:#fff; border:none; border-radius:4px; padding:0 14px; cursor:pointer; white-space:nowrap; font-size:.92em; height:42px; margin-top:5px; }
        .btn-inline:hover { background:#3A7A96; }
        .btn-inline:disabled { background:#aaa; cursor:not-allowed; }
        #detectarFeedback { min-height: 1.1em; font-size: .85em; margin: 4px 0 0; }
        button.salvar { background-color: #28a745; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; transition: background-color 0.3s; margin-top: 15px; }
        button.salvar:hover { background-color: #218838; }
        button.salvar:disabled { background-color: #aaa; cursor: not-allowed; }
        .feedback { text-align: center; margin-top: 15px; font-weight: bold; color: #4A93B0; }
        #contadorCores { font-size: .82em; color: #999; margin: 4px 0 0; }
        #contadorCores.excesso { color: #dc3545; font-weight: 600; }
    </style>
    <link rel="stylesheet" href="dark-mode.css">
    <script src="theme.js"></script>
    <script src="protecao-saida.js"></script>
</head>
<body>
    <div class="container">
        <h1>Cadastro de HueForge</h1>
        <form id="hueforgeForm">
            <fieldset>
                <legend>Dados do HueForge</legend>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Ex.: Batman" required>

                <label for="fonteUrl">Link da fonte (MakerWorld, opcional):</label>
                <div class="linha-link">
                    <input type="text" id="fonteUrl" placeholder="https://makerworld.com/...">
                    <button type="button" class="btn-inline" id="btnDetectar" onclick="detectarCores()"><i class="fas fa-magic"></i> Detectar cores</button>
                </div>
                <p id="detectarFeedback" class="hint"></p>

                <label>Cores necessárias:</label>
                <div id="corSeletor"></div>
                <p id="contadorCores" class="hint"></p>
            </fieldset>

            <button type="button" class="salvar" id="btnSalvar" onclick="salvar()">Salvar HueForge</button>
        </form>
        <p id="feedback" class="feedback"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCkGTyw1o7_XGpnXF9-dFwXyCxRZyJOG4c",
            authDomain: "calculo3d.firebaseapp.com",
            databaseURL: "https://calculo3d-default-rtdb.firebaseio.com",
            projectId: "calculo3d",
            storageBucket: "calculo3d.firebasestorage.app",
            messagingSenderId: "372705279593",
            appId: "1:372705279593:web:0b584c7a71dd3675a96cf8",
            measurementId: "G-V2QT1GVLS0"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();
        const CAMINHO_RTDB = "hueforges";
        const CAMINHO_CONTADOR = "contador_hueforges/proximoId";

        let idEmEdicao = null;
        let dataCriacaoOriginal = null;
        let seletorCores = null;

        // HueForges reaproveita a permissão do módulo 'produtos'
        (async function () {
            if (!(await initEmpresa())) return;
            if (negarAcesso('produtos')) return;
            seletorCores = Hueforge.montarSeletorCores({
                container: document.getElementById('corSeletor'),
                selecionadas: [],
                onChange: atualizarContadorCores
            });
            atualizarContadorCores(seletorCores.getSelecionadas());
            verificarModoEdicao();
        })();

        function atualizarContadorCores(lista) {
            const el = document.getElementById('contadorCores');
            const n = lista.length;
            if (n > 4) {
                el.textContent = `${n} cores — precisa de mais de 4 cores, nunca cabe em 1 carga da impressora.`;
                el.classList.add('excesso');
            } else {
                el.textContent = `${n} cor(es) selecionada(s).`;
                el.classList.remove('excesso');
            }
        }

        function verificarModoEdicao() {
            const id = new URLSearchParams(window.location.search).get('id');
            if (id) {
                idEmEdicao = id;
                document.getElementById('feedback').textContent = `Carregando HueForge #${id}...`;
                empresaRef(CAMINHO_RTDB + '/' + id).once('value')
                    .then((snapshot) => {
                        if (snapshot.exists()) preencherFormulario(snapshot.val());
                        else document.getElementById('feedback').textContent = `Erro: HueForge #${id} não encontrado.`;
                    })
                    .catch((error) => {
                        document.getElementById('feedback').textContent = `Erro ao carregar dados: ${error.message}`;
                    });
            } else {
                document.getElementById('feedback').textContent = "Modo: Novo Cadastro.";
            }
        }

        function preencherFormulario(dados) {
            document.getElementById('nome').value = dados.nome || '';
            document.getElementById('fonteUrl').value = dados.fonteUrl || '';
            seletorCores.setSelecionadas(dados.cores || []);
            atualizarContadorCores(seletorCores.getSelecionadas());
            dataCriacaoOriginal = dados.dataCriacao || null;

            document.querySelector('h1').textContent = `Editar HueForge #${idEmEdicao}`;
            document.querySelector('button.salvar').textContent = "Atualizar HueForge";
            document.getElementById('feedback').textContent = `Dados do HueForge #${idEmEdicao} carregados.`;
        }

        // ── Detectar cores a partir do link (chama a Cloud Function que faz o scrape) ──
        window.detectarCores = async function () {
            const url = document.getElementById('fonteUrl').value.trim();
            const fb = document.getElementById('detectarFeedback');
            if (!url) { fb.style.color = '#dc3545'; fb.textContent = 'Cole um link antes de detectar.'; return; }
            const btn = document.getElementById('btnDetectar');
            btn.disabled = true;
            fb.style.color = '#4A93B0'; fb.textContent = 'Buscando página...';
            try {
                const resp = await fetch('/api/hueforge/scrape?url=' + encodeURIComponent(url));
                const json = await resp.json();
                if (!json.success) throw new Error(json.error || 'Falha ao buscar a página.');
                const texto = (json.data && json.data.texto) || '';
                const detectadas = Hueforge.detectarCoresEmTexto(texto);
                if (!detectadas.length) {
                    fb.style.color = '#e66a2e'; fb.textContent = 'Nenhuma cor reconhecida na página — selecione manualmente.';
                } else {
                    const atuais = seletorCores.getSelecionadas();
                    seletorCores.setSelecionadas([...new Set(atuais.concat(detectadas))]);
                    atualizarContadorCores(seletorCores.getSelecionadas());
                    fb.style.color = '#28a745'; fb.textContent = `Detectado: ${detectadas.join(', ')}. Confira antes de salvar.`;
                }
            } catch (e) {
                fb.style.color = '#dc3545'; fb.textContent = 'Erro: ' + e.message + ' — preencha as cores manualmente.';
            } finally {
                btn.disabled = false;
            }
        };

        window.salvar = function () {
            const nome = document.getElementById('nome').value.trim();
            const fonteUrl = document.getElementById('fonteUrl').value.trim();
            const cores = seletorCores.getSelecionadas();

            if (!nome) { alert("Informe o nome do HueForge."); return; }
            if (!cores.length) { alert("Selecione ao menos uma cor."); return; }

            const dados = {
                nome,
                fonteUrl: fonteUrl || null,
                cores,
                dataCriacao: dataCriacaoOriginal || new Date().toISOString()
            };

            if (idEmEdicao) salvarHueforge(idEmEdicao, dados, 'atualizado');
            else obterProximoId(dados);
        };

        function obterProximoId(dados) {
            document.getElementById('feedback').textContent = "Buscando ID sequencial...";
            empresaRef(CAMINHO_CONTADOR).transaction((currentData) => {
                return currentData === null ? 1 : currentData + 1;
            })
            .then(result => {
                if (result.committed) {
                    const idParaSalvar = result.snapshot.val();
                    salvarHueforge(idParaSalvar, { ...dados, idSequencial: idParaSalvar }, 'salvo');
                } else {
                    document.getElementById('feedback').textContent = "Falha temporária na transação. Tente novamente.";
                }
            })
            .catch(error => {
                document.getElementById('feedback').textContent = "Erro ao obter ID: " + error.message;
            });
        }

        function salvarHueforge(id, dados, acao) {
            empresaRef(CAMINHO_RTDB + '/' + id).set(dados)
                .then(() => {
                    document.getElementById('feedback').textContent = `HueForge #${id} ${acao} com sucesso!`;
                    KombineiSaida.liberar();
                    setTimeout(() => { window.location.href = 'listagem_hueforges.html'; }, 1200);
                })
                .catch((error) => {
                    document.getElementById('feedback').textContent = `Erro ao salvar: ` + error.message;
                });
        }
    </script>
</body>
</html>
